name: vaultcard
description: Privacy-first prepaid gift card manager.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_native_timezone: ^2.0.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  uuid: ^4.5.1
  intl: ^0.19.0
  dio: ^5.7.0
  html: ^0.15.4
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  google_mlkit_text_recognition: ^0.13.0
  workmanager: ^0.5.2
  camera: ^0.11.0+2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/fixtures/
