workflows:
  ios-simulator-appetize:
    name: iOS Simulator Build for Appetize
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS simulator app
        script: flutter build ios --simulator --debug
      - name: Zip Appetize artifact
        script: |
          cd build/ios/iphonesimulator
          zip -r VaultCard-ios-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/VaultCard-ios-simulator.zip
